# Economy Service: the backend is a single Redis-free process (api-http) that
# depends only on Postgres + Judge0 (external API). Redis has been removed.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: perp
      POSTGRES_PASSWORD: perp
      POSTGRES_DB: perpdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

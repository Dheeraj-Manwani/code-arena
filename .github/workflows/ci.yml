name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The backend is a single Redis-free process: api-http (Economy Service). The
# judge-worker and realtime-gateway services were consolidated into api-http/src,
# so their standalone CI jobs were removed.
jobs:
  api-http:
    name: api-http (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-http
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: api-http/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma client
        # Invoked directly to bypass pnpm's pre-run deps check (build scripts are gated).
        run: node node_modules/prisma/build/index.js generate
      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Test
        run: npx vitest run
